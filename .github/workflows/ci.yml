name: build_project

on:
  push:
    branches:
      - 'cicd/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: java --version
